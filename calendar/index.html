<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendario · ACG Rosalía de Castro</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <section class="hero" id="hero" aria-live="polite"></section>

  <section class="month" id="month" aria-label="Calendario mensual">
    <header class="month-head">
      <button class="icon-btn" id="prevMonth" aria-label="Mes anterior">
        <svg viewBox="0 -960 960 960" aria-hidden="true"><path d="m406-481 177 177q9 9 8.5 21t-9.5 21q-9 9-21.5 9t-21.5-9L341-460q-5-5-7-10t-2-11q0-6 2-11t7-10l199-199q9-9 21.5-9t21.5 9q9 9 9 21.5t-9 21.5L406-481Z"/></svg>
      </button>
      <h2 id="monthTitle"></h2>
      <button class="today-btn" id="todayBtn" hidden>Hoy</button>
      <button class="icon-btn" id="nextMonth" aria-label="Mes siguiente">
        <svg viewBox="0 -960 960 960" aria-hidden="true"><path d="M530-481 353-658q-9-9-8.5-21t9.5-21q9-9 21.5-9t21.5 9l198 198q5 5 7 10t2 11q0 6-2 11t-7 10L396-261q-9 9-21 8.5t-21-9.5q-9-9-9-21.5t9-21.5l176-176Z"/></svg>
      </button>
    </header>
    <div class="weekdays" aria-hidden="true">
      <span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span>
    </div>
    <div class="grid" id="grid" role="grid"></div>
  </section>

  <section class="agenda" aria-labelledby="listTitle">
    <div class="agenda-head">
      <h3 id="listTitle"></h3>
      <button class="link-btn" id="showMonth" hidden>Ver todo el mes</button>
    </div>
    <ol class="events" id="events"></ol>
    <p class="empty" id="empty" hidden></p>
  </section>

  <footer class="status" id="status"></footer>
</main>

<div class="sheet-backdrop" id="backdrop" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-grip" aria-hidden="true"></div>
    <button class="icon-btn sheet-close" id="sheetClose" aria-label="Cerrar">
      <svg viewBox="0 -960 960 960" aria-hidden="true"><path d="M480-438 270-228q-9 9-21 9t-21-9q-9-9-9-21t9-21l210-210-210-210q-9-9-9-21t9-21q9-9 21-9t21 9l210 210 210-210q9-9 21-9t21 9q9 9 9 21t-9 21L522-480l210 210q9 9 9 21t-9 21q-9 9-21 9t-21-9L480-438Z"/></svg>
    </button>
    <h2 id="sheetTitle"></h2>
    <div class="sheet-body" id="sheetBody"></div>
    <div class="sheet-actions" id="sheetActions"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script src="../config.js"></script>
<script src="../bridge.js"></script>
<script src="ics.js"></script>
<script src="app.js"></script>
</body>
</html>
